# Blog tag taxonomy for the Sai University Wiki.
# Groups: (1) one tag per club, (2) one tag per committee, (3) one tag per
# fest plus a generic `fest` tag, (4) event-type tags, (5) content-type tags
# (`blog` vs `events`) that decide which sitewide page a post surfaces on,
# plus a standalone tag for posts written by an individual student rather
# than on behalf of a club. A post can carry a club/fest/committee tag AND an
# event-type tag AND a content-type tag AND (if applicable) student-voices.
#
# Tags double as the club/fest/committee -> event listing mechanism: tagging
# a post `art-club` makes it show up on /blog/tags/art-club automatically, no
# separate frontmatter field needed to link an event back to its club.
#
# Content-type tags (`blog` vs `events`) are what /events and /student-voices
# (the "Blog" page) filter on — see src/pages/events.js and
# src/pages/student-voices.js. `blog` = general club-authored writing, not
# tied to a dated event. `events` = explicit event coverage; posts that only
# carry a club/fest/committee/event-type tag without an explicit `blog` tag
# still default to showing up on /events (no forced retagging of older
# posts) — `events` just makes the intent explicit going forward.

