# Blog tag taxonomy for the Sai University Wiki.
# Three groups: (1) one tag per club, (2) one tag per fest, (3) event-type
# tags, plus a standalone tag for posts written by an individual student
# rather than on behalf of a club. A post can carry a club/fest tag AND an
# event-type tag AND (if applicable) student-voices.
#
# Tags double as the club/fest -> event listing mechanism: tagging a post
# `art-club` makes it show up on /blog/tags/art-club automatically, no
# separate frontmatter field needed to link an event back to its club.

# ---- Clubs ----
