# Decap CMS config. Backend is `github` (Option A in
# `docs-internal/decap-cms-auth-todo.md`) — confirmed once GitHub Pages
# hosting was settled, now buildable for real since the OAuth-proxy it
# needs can run on the VPS (see `vps-hosting-plan.md`).
#
# `base_url`/`auth_endpoint` point at whatever's running that proxy right
# now. **Currently `netlify/functions/{auth,callback}.js`** — a serverless
# twin of `oauth-proxy/server.js`, deployed alongside the Netlify *test*
# site so real GitHub login can actually be exercised before the Hostinger
# VPS exists (see `vps-hosting-plan.md`'s "Netlify test deploy" section).
# This means production `/admin` (GitHub Pages) is *also* authenticating
# through Netlify's functions for now — intentional and fine, the
# OAuth-proxy is decoupled from wherever the static site itself is served
# from by design. Swap this to the standalone `oauth-proxy/` service's real
# deployed URL once the Hostinger VPS is reachable (Phase 3 of the
# checklist in `vps-hosting-plan.md`); until the Netlify site exists at
# all, this is the literal placeholder `REPLACE-WITH-DEPLOYED-OAUTH-PROXY-URL`
# and login fails at the "Login with GitHub" step.
#
# Local development doesn't need any of that: `local_backend: true` below
# makes Decap talk to a local proxy (`npm run cms:proxy`, i.e.
# `decap-server`) instead, which reads/writes this checkout's real files
# directly — no GitHub account, no OAuth App, no deployed proxy required.
# See `docs-internal/decap-cms-auth-todo.md` for the full local-testing
# steps.
# `base_url` MUST be a bare origin with no path, and every path segment
# belongs in `auth_endpoint` instead. This is not cosmetic — it's the single
# non-obvious trap in this whole setup, and getting it wrong fails silently
# with no error anywhere. Decap builds the auth URL as
# `${base_url}/${auth_endpoint}` (so the split below produces the identical
# URL either way), but its two `postMessage` listeners both gate on
# `event.origin === base_url`, and `MessageEvent.origin` is *always* a bare
# origin — never a path. With a path in `base_url`, that comparison can
# never be true: the handshake ping is ignored, so the success listener is
# never even installed, so the real token is never accepted. Symptom is a
# login that looks like it works (GitHub authorizes, a real token is
# fetched) but leaves `/admin` sitting on the login button forever.
# Verified by reading the actual shipped decap-cms@3 bundle, not inferred.
backend:
  name: github
  repo: ChargingTrex/collage-wiki-SAIU
  branch: main
  base_url: https://glittery-licorice-720230.netlify.app
  auth_endpoint: .netlify/functions/auth

local_backend: true

# Required by Decap's config schema even though the one collection below
# defines its own per-post `media_folder`/`public_folder` (co-located with
# each event, not this shared folder) — this is only the fallback default
# for any future collection that doesn't override it. Actually testing
# `/admin` past the login screen (not just editing YAML blind) is what
# surfaced this was missing — Decap's schema validation failed the whole
# config over it before any collection-specific settings even mattered.
media_folder: static/img
public_folder: /img

# Only the "Events" collection is wired up. Club and fest pages
# (docs/clubs/<slug>/index.mdx, docs/fests/<slug>.mdx) are deliberately left
# out for now — they're MDX with hero-component imports and a <ClubContact>
# embed, not plain prose. Decap CMS collections replace a file's *entire*
# frontmatter + body with only what's represented in `fields:`; a
# non-technical editor saving a partial edit through a generic body widget
# would silently strip those imports and break the page. Exposing club/fest
# editing safely needs the prose pulled out into plain frontmatter fields
# the JSX reads from, not freehand MDX body access — that's a content-model
# change, not a CMS-config change, and hasn't happened yet.
collections:
  - name: events
    label: Events
    label_singular: Event
    description: >-
      One shared collection for two audiences, same as the site's own
      /events (club/fest write-ups) vs /student-voices (individual student
      posts) split — both live in this same folder and are told apart
      purely by tag, not by anything in this CMS. Club leads: tag with the
      club/fest it belongs to (see blog/tags.yml for the full list) so it
      shows up on that club's own Events page automatically. Students
      posting for themselves, not on behalf of a club: use the
      "student-voices" tag instead of a club tag, and fill in Author Name
      below.
    folder: blog
    create: true
    slug: '{{slug}}'
    path: '{{year}}-{{month}}-{{day}}-{{slug}}/index'
    extension: md
    format: frontmatter
    # Uploaded images land in the SAME folder as the post they belong to
    # (not a shared static/img/ directory) — required so the post stays
    # self-contained and its images compress/move correctly as the archive
    # grows. See CONTRIBUTING.md's "Adding a new event post" section.
    media_folder: ''
    public_folder: ''
    fields:
      - {label: Title, name: title, widget: string}
      - {label: Date, name: date, widget: datetime}
      - label: Tags
        name: tags
        widget: select
        multiple: true
        min: 1
        hint: >-
          At least one club/fest/committee tag, plus an event-type tag if it
          fits. Use "student-voices" instead of a club tag for an individual
          student's own post. Add "blog" for general club writing that isn't
          event coverage (shows on the Blog page instead of Events), or
          "events" to mark event coverage explicitly. Keep this list in sync
          with blog/tags.yml — Decap can't read that file directly.
        options:
          - literary-club
          - art-club
          - dance-club
          - gardening-club
          - astronomy-club
          - theatre-club
          - photography-club
          - gaming-club
          - oratory-club
          - entrepreneurship-club
          - fashion-club
          - science-society
          - music-club
          - film-society
          - turingites-computer-science-society
          - animal-welfare-society
          - martial-arts-club
          - foss-club
          - chess-club
          - pugwash-society
          - sports-society
          - {label: 'Cultural Society', value: cultural-committee}
          - student-government
          - tech-fest
          - general-fest
          - cultural-fest
          - workshop
          - competition
          - talk
          - screening
          - exhibition
          - performance
          - hackathon
          - blog
          - events
          - student-voices
      - label: Author
        name: authors
        widget: object
        required: false
        hint: >-
          Only for a "student-voices" post — leave blank for a club/fest
          event (it's posted on behalf of the club, not an individual).
          Note: Docusaurus reads a bare string here as a lookup key into
          blog/authors.yml, not a literal name — this has to stay a
          one-field object (Name) for a fresh name to actually show up as
          the byline. Verified against a real build, not assumed.
        fields:
          - {label: Name, name: name, widget: string}
      - {label: Description, name: description, widget: string, required: false, hint: 'Optional — shown as the post preview/excerpt.'}
      - label: Feature Image
        name: image
        widget: image
        required: false
        hint: >-
          Optional. Shown as the card thumbnail on the homepage Recent
          Activity section, this club's Events page, and the sitewide
          Events/Blog feed. Landscape photos (roughly 3:2 or 16:9) work
          best — card thumbnails are small and wide, not tall. Uploads
          land in this post's own folder, same as body images.
      - {label: Body, name: body, widget: markdown}
